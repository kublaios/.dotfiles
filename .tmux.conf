# start windows numbering at 1
set -g base-index 1
# faster command sequences
set -s escape-time 0

# Keybindings
bind -n C-q next-window
bind -n C-` select-pane -t :.+ # Next pane
bind -n C-s copy-mode # Enter selection mode
bind -n C-M-n new-window # Create new window
bind -n C-M-h split-window -h # Create horizontal split
bind -n C-M-v split-window -v # Create vertical split

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# Set vi mode
set-window-option -g mode-keys vi
# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

run '~/.tmux/plugins/tpm/tpm'
