# start windows numbering at 1
set -g base-index 1
# faster command sequences
set -s escape-time 0

# Keybindings
bind -n C-q next-window
bind -n C-` select-pane -t :.+ # Next pane
bind -n C-s copy-mode # Enter selection mode
bind -n C-M-n new-window # Create new window
bind -n C-M-h split-window -h # Create horizontal split
bind -n C-M-v split-window -v # Create vertical split

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# - Popups

# Show lazygit in the current directory
bind -n C-g display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "lazygit"

# Show nvim in the current directory
bind e display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "nvim ."

# Show new window creation prompt
bind -n C-n display-popup \
  -E 'bash -i -c "read -p \"Window name: \" name; tmux new-window -n \$name"'

# Show set brightness prompt
bind -n C-b display-popup \
  -E 'bash -i -c "read -p \"Brightness (0-100): \" brightness; brightnessctl set \$brightness%"'

# Display list of inactive windows
bind -n C-p display-popup \
  -E "tmux list-windows -f '#{==:#{window_active},0}' -F '#{window_index}:#{window_name}' | fzf --reverse | cut -d: -f1 | xargs tmux select-window -t"

# Display list of all windows
# bind -n C-p display-popup \
#   -E "tmux list-windows -F '#{window_index}:#{window_name}' | fzf --reverse | cut -d: -f1 | xargs tmux select-window -t"

# - End of popups

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# Set vi mode
set-window-option -g mode-keys vi
# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

run '~/.tmux/plugins/tpm/tpm'
