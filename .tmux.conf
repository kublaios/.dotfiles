# start windows numbering at 1
set -g base-index 1
# faster command sequences
set -s escape-time 0
# Enable extended keys for pi and other TUI applications
set -g extended-keys on
set -g extended-keys-format csi-u

# Keybindings
bind -n C-q next-window
bind -n C-1 previous-window
bind -n C-` select-pane -t :.+ # Next pane
# Disabled due to collision with copilot-cli add MCP bindings
# bind -n C-s copy-mode # Enter selection mode
bind -n C-M-n new-window # Create new window
bind -n C-M-h split-window -h # Create horizontal split
bind -n C-M-v split-window -v # Create vertical split
# Create a fresh __bg session, keeping the current session's name, then switch to it
bind m run-shell '~/.dotfiles/scripts/tmux-background-session.sh "#{session_name}" "#{pane_current_path}"'

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# - Popups

# Show lazygit in the current directory
bind -n C-g display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "lazygit"

# Show nvim in the current directory
bind e display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "nvim ."

# Show zsh in the current directory
bind z display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "zsh ."

# Show bash in the current directory
bind h display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "bash ."

# Edit entered config file in vim (vim ~/.dotfiles/.{$file_name})
bind k display-popup \
  -E 'bash -c "read -p \"Config file: \" file_name; tmux new-window -n \"\$file_name\" \"nvim \\$HOME/.dotfiles/.\$file_name\""'

# Show new window creation prompt
bind -n C-n display-popup \
  -E 'bash -i -c "read -p \"Window name: \" name; path=\$(zoxide query \"\$name\"); tmux new-window -n \"\$name\" -c \"\$path\""'

# Rename window
bind r display-popup \
  -E 'bash -c "read -p \"Rename to: \" name; tmux rename-window \"\$name\""'

# Display list of inactive windows
bind -n C-p display-popup \
  -E "tmux list-windows -f '#{==:#{window_active},0}' -F '#{window_index}:#{window_name}' | fzf --reverse | cut -d: -f1 | xargs tmux select-window -t"

# Display list of sessions and kill the selected one
bind -n C-x display-popup \
  -E "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt 'Kill session: ' | xargs -r tmux kill-session -t"

if-shell '[ "$(uname -s)" = "Linux" ]' {
  # Show set brightness prompt
  bind B display-popup \
    -E 'bash -i -c "read -p \"Brightness (0-100): \" brightness; brightnessctl set \$brightness%"'

  # Show greenclip history
  # TODO: Figure out why this doesn't work
  bind b display-popup \
    -w 50% \
    -h 50% \
    -E "greenclip print | grep . | fzf --reverse | xargs -r -d'\n' -I '{}' greenclip print '{}'"
}

# - End of popups

# Enable mouse support
set -g mouse on

# Set vi mode
set-window-option -g mode-keys vi
# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Auto-switch prefix when SSH clients connect/disconnect
set-hook -g client-attached 'run-shell ~/.dotfiles/scripts/auto-switch-tmux-prefix.sh'
set-hook -g client-detached 'run-shell ~/.dotfiles/scripts/auto-switch-tmux-prefix.sh'

# Also run on config reload
run 'bash ~/.dotfiles/scripts/auto-switch-tmux-prefix.sh'
